name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 nose

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=127 --per-file-ignores='features/steps/*.py:F811,features/environment.py:E302,service/__init__.py:F401,service/routes.py:F401,tests/test_models.py:F401,tests/test_routes.py:F401'

      - name: Run unit tests with nose
        run: |
          nosetests tests/
